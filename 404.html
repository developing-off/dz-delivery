<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page introuvable — dz-delivery</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --bg: #f4f5f2; --ink: #14181c; --muted: #6b757c; --accent: #1a6b4a; --accent-ink: #0f3f2c; --line: #d8ddd6; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14181c; --ink: #e8ebe7; --muted: #9aa3a9; --accent: #4fb385; --accent-ink: #7fd0a8; --line: #2c3338; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem;
           background: var(--bg); color: var(--ink); font: 1.0625rem/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 34rem; }
    .code { font: 600 0.9rem ui-monospace, monospace; color: var(--muted); letter-spacing: 0.08em; }
    h1 { margin: 0.25rem 0 0.75rem; font-size: 1.75rem; letter-spacing: -0.02em; }
    p { margin: 0 0 1.25rem; color: var(--muted); }
    a { color: var(--accent-ink); text-underline-offset: 3px; }
    a:hover { color: var(--accent); }
    ul { list-style: none; padding: 1rem 0 0; margin: 0; border-top: 1px solid var(--line);
         display: flex; flex-wrap: wrap; gap: 0.5rem 1.1rem; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Cette page n’existe pas</h1>
    <p>Le lien est peut-être ancien ou mal saisi. Retournez à <a href="/">l’accueil de dz-delivery</a> ou choisissez un transporteur :</p>
    <ul>
      <li><a href="/yalidine/">Yalidine</a></li>
      <li><a href="/zrexpress/">ZR Express</a></li>
      <li><a href="/maystro/">Maystro</a></li>
      <li><a href="/ecotrack/">Ecotrack</a></li>
      <li><a href="/noest/">NoEST</a></li>
      <li><a href="/ecom/">E-com</a></li>
      <li><a href="/mdm/">MDM</a></li>
      <li><a href="/elogistia/">Elogistia</a></li>
    </ul>
  </main>
</body>
</html>
